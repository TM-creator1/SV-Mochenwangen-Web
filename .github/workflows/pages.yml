name: Publish PWA to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run update:magazine
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      # All providers are simulated; these tests send no requests to FuPa.
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy PWA
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show public address
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'PWA: %s\n\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Register tm-creator1.github.io in the FuPa club administration.\n' >> "$GITHUB_STEP_SUMMARY"
