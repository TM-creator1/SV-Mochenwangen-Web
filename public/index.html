<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#db0f0f">
  <meta name="description" content="Die Vereins-App des SV Mochenwangen: News, Liveticker, Spiele, Tabellen und Stadionheft.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SV Mochenwangen">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>SV Mochenwangen</title>
</head>
<body>
  <a class="skip-link" href="#content">Zum Inhalt</a>
  <div class="app">
    <header class="topbar">
      <button id="open-menu" class="icon-button" aria-label="Menü öffnen" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="heading"><h1 id="page-title">Home</h1><span id="page-subtitle" hidden></span></div>
      <button id="reload" class="icon-button" aria-label="Seite neu laden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></svg></button>
    </header>
    <nav id="home-tabs" class="home-tabs" aria-label="Home und Liveticker"></nav>
    <div id="offline-notice" class="notice" role="status" hidden>Du bist offline. App und bereits geladenes Stadionheft bleiben verfügbar. Live-Inhalte brauchen Internet.</div>
    <div id="update-notice" class="notice update" hidden>Eine neue App-Version ist verfügbar. <button id="apply-update">Jetzt aktualisieren</button></div>
    <div class="source-bar"><span id="source-label">Vereinswebsite</span><a id="source-link" href="https://sv-mochenwangen.de/" target="_blank" rel="noopener noreferrer">Extern öffnen <span aria-hidden="true">↗</span></a></div>
    <main id="content" tabindex="-1"></main>
  </div>
  <dialog id="menu-dialog" class="menu-dialog" aria-labelledby="menu-title">
    <div class="sheet-bar"><h2 id="menu-title">Menü</h2><button id="close-menu" class="text-button">Schließen</button></div>
    <div class="menu-scroll"><div class="club-brand"><img src="./icons/club-emblem.png" width="60" height="60" alt=""><strong>SV Mochenwangen</strong></div><nav id="club-menu" aria-label="Vereinsnavigation"></nav>
    <div class="menu-footer"><button id="install-app" class="primary-button">App installieren</button><p>Dein Verein. Immer dabei.</p></div></div>
  </dialog>
  <dialog id="install-dialog" class="install-dialog" aria-labelledby="install-title">
    <img src="./icons/icon-192.png" width="72" height="72" alt="">
    <h2 id="install-title">SV Mochenwangen installieren</h2>
    <p id="install-instructions"></p>
    <button id="native-install" class="primary-button" hidden>Jetzt installieren</button>
    <button id="close-install" class="text-button">Schließen</button>
  </dialog>
  <noscript><p class="noscript">Bitte JavaScript aktivieren. Alternativ: <a href="https://sv-mochenwangen.de/">Vereinswebsite öffnen</a>.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
